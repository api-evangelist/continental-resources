    - url: https://www.clr.com/llms.txt
      status: 404
      finding: No provider-published llms.txt.
    - url: https://connect.clr.com/
      status: 200
      finding: >-
        Redirects to /Citrix/StoreWeb/ — a Citrix StoreFront employee remote
        access gateway, not an API. Every other path on the host returns 403 to
        an anonymous client.
    - url: https://www.continental-resources.com/
      status: 0
      finding: >-
        NXDOMAIN. The domain this repo previously recorded as the company
