other_probes:
  note: >-
    Contract-discovery probes outside /.well-known/, recorded here so the search
    is auditable. Not read by the scorer.
  probes:
    - url: https://www.clr.com/robots.txt
      status: 200
      finding: >-
        Real robots.txt. Crawl-delay 10, Disallow empty (crawling permitted),
        sitemap at https://www.clr.com/sitemap_index.xml. No API or docs paths
        named.
    - url: https://www.clr.com/sitemap_index.xml
      status: 200
      finding: >-
        One child sitemap, page-sitemap.xml, listing the complete public site —
        56 pages. Not one of them is a developer, API, docs or reference page.
    - url: https://www.clr.com/wp-json
      status: 401
      finding: >-
        The site runs WordPress, so a wp-json REST root exists, but it is
        deliberately closed. Body is application/json and reads
        {"code":"rest_cannot_access","message":"DRA: Only authenticated users
        can access the REST API.","data":{"status":401}} — the Disable REST API
        plugin. This is the only machine-readable surface on the domain and the
        company has explicitly switched it off, so it is not a published API.
    - url: https://www.clr.com/wp-json/wp/v2
      status: 401
      finding: Same DRA gate as the wp-json root.
    - url: https://www.clr.com/openapi.json
      status: 404
      finding: WordPress 404 page.
    - url: https://www.clr.com/openapi.yaml
      status: 404
