name: Continental Resources
description: >-
  Continental Resources, Inc. is a privately held independent oil and natural
  gas exploration and production company headquartered in Oklahoma City,
  Oklahoma, and present on the web at clr.com. Its U.S. asset base spans the
  Bakken of North Dakota, South Dakota and Montana, the Anadarko Basin of
  Oklahoma, the Powder River Basin of Wyoming and the Permian Basin of Texas,
  with international positions in Argentina's Vaca Muerta shale and a joint
  venture in the Diyarbakir Basin of Turkey. The company was taken private in
  November 2022 in a $4.3B transaction with the Hamm family and is no longer
  publicly traded. Continental Resources publishes no developer program, API
  documentation, or machine-readable contract of any kind; this profile
  catalogs its corporate, owner-relations, operational and sustainability web
  properties and records that its royalty-owner, vendor-invoicing and
  employee-access surfaces are each operated by a third-party software vendor
  rather than by Continental itself.
