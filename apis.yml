name: Continental Resources
description: >-
  Continental Resources is a privately held independent oil and natural gas
  exploration and production company headquartered in Oklahoma City with
  operations focused on the Bakken play of North Dakota and Montana and the
  SCOOP and STACK plays of Oklahoma. The company was taken private in
  November 2022 in a $4.3B transaction with the Hamm family and is no longer
  publicly traded. Continental Resources does not publish public developer
  APIs; this profile catalogs its corporate, investor, sustainability, and
  operational web properties.
